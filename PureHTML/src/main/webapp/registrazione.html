<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
        <header>
            <h1>Registrazione</h1>
        </header>

        <div class="corpo">
            <div class="login-panel">
                <form action="ControllaRegistrazione" method="POST">
                
                	<div th:if="${errReg}">
						<div class="errore" th:text="${errReg}"></div><br><br>
					</div>

					<label for="username">Username</label><br>
                    <input type="text" class="input-box" placeholder="Massimo 16 caratteri" id="username" name="username" max="16" required><br><br>

                    <label for="mail">E-Mail</label><br>
                    <input type="email" class="input-box" placeholder="indirizzo@mail.com" id="email" name="email" required><br><br>

                    <label for="password1">Password</label><br>
                    <input type="password" class="input-box" placeholder="Almeno 8 caratteri" id="password1" name="password1" min="8" required><br><br>

                    <label for="password2">Ripeti Password</label><br>
                    <input type="password" class="input-box" placeholder="Almeno 8 caratteri" id="password2" name="password2" min="8" required><br><br><br>

                    <input type="submit" value="Registrati">
                </form>
                
                <div class="errore" th:if="${ErrReg}">
					<div th:text="${ErrReg}"></div>
				</div>

                <a href="login.html">Indietro</a> <br><br>
            </div>
        </div>
    </body>
</html>
